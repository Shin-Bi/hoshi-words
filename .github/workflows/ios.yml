name: iOS build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Analyze, test and build iOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Check SideStore app names
        run: python3 -m unittest discover -s test/ios -p '*_test.py' -v
      - name: Build simulator
        run: flutter build ios --simulator --debug
      - name: Build unsigned release
        run: flutter build ios --release --no-codesign
